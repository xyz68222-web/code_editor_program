
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .leftpart {
            flex-basis: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: pink;
        }

        .Content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 5px;
        }

        .Content label {
            display: block;
            background-color: blue;
            color: white;
            padding: 10px;
        }

        .Content textarea {
            flex: 1;
            width: 100%;
            resize: none;
            padding: 10px;
            outline: none;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 14px;
        }

        .rightpart {
            flex-basis: 50%;
            height: 100%;
            background-color: black;
        }

        .rightpart label {
            display: block;
            background-color: salmon;
            padding: 10px;
            color: white;
        }

        .rightpart iframe {
            width: 100%;
            height: calc(100% - 39px);
            display: block;
            border: none;
            background-color: white;
        }
    </style>
</head>

<body>

    <div class="leftpart">

        <div class="Content">
            <label>HTML</label>
            <textarea placeholder="Write HTML here..."></textarea>
        </div>

        <div class="Content">
            <label>CSS</label>
            <textarea placeholder="Write CSS here..."></textarea>
        </div>

        <div class="Content">
            <label>JavaScript</label>
            <textarea placeholder="Write JavaScript here..."></textarea>
        </div>

    </div>

    <div class="rightpart">
        <label>Output</label>
        <iframe id="output"></iframe>
    </div>

    <script>
        let output = document.querySelector("#output");
        let allInputareas = document.querySelectorAll(".leftpart textarea");

        let htmlCode = "";
        let cssCode = "";
        let jsCode = "";

        function runCode() {
            let doc = output.contentDocument;

            doc.body.innerHTML = htmlCode;

            doc.head.innerHTML = "<style>" + cssCode + "</style>";

            try {
                output.contentWindow.eval(jsCode);
            } catch (error) {
                console.log("JavaScript error:", error);
            }
        }

        allInputareas.forEach((textarea, index) => {
            textarea.addEventListener("input", () => {

                if (index === 0) {
                    htmlCode = textarea.value;
                }
                else if (index === 1) {
                    cssCode = textarea.value;
                }
                else {
                    jsCode = textarea.value;
                }

                runCode();
            });
        });
    </script>

</body>
</html>
